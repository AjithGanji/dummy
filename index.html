<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Southern Regional Grid - AR panel</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0b; overflow: hidden; font-family: system-ui, sans-serif; }
  #hud { position: fixed; top: 10px; left: 10px; right: 10px; color: #cfcfcf; font-size: 13px; line-height: 1.5;
         z-index: 5; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #hud b { color: #fff; }
  #msg { position: fixed; bottom: 70px; left: 0; right: 0; text-align: center; color: #aaa; font-size: 13px; z-index: 5; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">
  <b>Southern Regional Grid</b> - static SCADA panel<br>
  Quest: press <b>Enter AR</b> (bottom). Trigger = grab and move. Right stick up/down = size.
  Left stick up/down = dark backing. A / X = reset position.
</div>
<div id="msg"></div>

<script type="module">
import * as THREE from 'three';
import { ARButton } from 'three/addons/webxr/ARButton.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const PANEL_W = 2.4;           // panel width in metres at start
const START_POS = new THREE.Vector3(0, 1.35, -1.3);

const manifest = await (await fetch('tiles/manifest.json')).json();
const panelH = PANEL_W * manifest.height / manifest.width;

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0b0b);   // desktop preview only; removed in AR
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 50);
camera.position.set(0, 1.35, 1.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(START_POS);
controls.update();

// ---------- panel made of tiles ----------
// Black pixels become see-through so the room shows through; "backing" adds a dark film for legibility.
const uniforms = { backing: { value: 0.45 }, gain: { value: 1.6 } };
const mat = (tex) => new THREE.ShaderMaterial({
  uniforms: { map: { value: tex }, backing: uniforms.backing, gain: uniforms.gain },
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D map; uniform float backing; uniform float gain; varying vec2 vUv;
    void main(){
      vec4 c = texture2D(map, vUv);
      float l = max(max(c.r, c.g), c.b);
      float a = clamp(l * gain, backing, 1.0);
      gl_FragColor = vec4(c.rgb, a);
      #include <colorspace_fragment>
    }`
});

const panel = new THREE.Group();
panel.position.copy(START_POS);
scene.add(panel);

const loader = new THREE.TextureLoader();
const maxAniso = renderer.capabilities.getMaxAnisotropy();
let loaded = 0;
const msg = document.getElementById('msg');
for (const t of manifest.tiles) {
  loader.load(t.file, (tex) => {
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = maxAniso;
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    const w = PANEL_W * t.w / manifest.width, h = PANEL_W * t.h / manifest.width;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat(tex));
    m.position.set(-PANEL_W / 2 + (t.x + t.w / 2) / manifest.width * PANEL_W,
                    panelH / 2 - (t.y + t.h / 2) / manifest.width * PANEL_W, 0);
    panel.add(m);
    msg.textContent = (++loaded < manifest.tiles.length) ? `Loading tiles ${loaded}/${manifest.tiles.length}` : '';
  });
}

// ---------- AR button ----------
document.body.appendChild(ARButton.createButton(renderer, { optionalFeatures: ['local-floor'] }));
renderer.xr.addEventListener('sessionstart', () => {
  scene.background = null;
  controls.enabled = false;
  panel.position.copy(START_POS); panel.rotation.set(0, 0, 0);
  document.getElementById('hud').style.display = 'none';
});
renderer.xr.addEventListener('sessionend', () => {
  scene.background = new THREE.Color(0x0b0b0b);
  controls.enabled = true;
  document.getElementById('hud').style.display = '';
});

// ---------- grab and move with controller / pinch ----------
for (let i = 0; i < 2; i++) {
  const ctrl = renderer.xr.getController(i);
  ctrl.addEventListener('selectstart', () => ctrl.attach(panel));
  ctrl.addEventListener('selectend',   () => scene.attach(panel));
  scene.add(ctrl);
}

// ---------- thumbsticks: size / backing, A/X: reset ----------
const prevBtn = {};
function pollInput(dt) {
  const session = renderer.xr.getSession();
  if (!session) return;
  for (const src of session.inputSources) {
    const gp = src.gamepad; if (!gp) continue;
    const y = gp.axes[3] ?? 0;
    if (Math.abs(y) > 0.15) {
      if (src.handedness === 'right') {
        const s = THREE.MathUtils.clamp(panel.scale.x * (1 - y * dt * 0.9), 0.3, 4);
        panel.scale.setScalar(s);
      } else if (src.handedness === 'left') {
        uniforms.backing.value = THREE.MathUtils.clamp(uniforms.backing.value - y * dt * 0.6, 0, 0.95);
      }
    }
    const pressed = !!(gp.buttons[4] && gp.buttons[4].pressed);
    if (pressed && !prevBtn[src.handedness]) {
      scene.attach(panel);
      panel.position.copy(START_POS); panel.rotation.set(0, 0, 0); panel.scale.setScalar(1);
    }
    prevBtn[src.handedness] = pressed;
  }
}

// ---------- loop ----------
let last = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min((now - last) / 1000, 0.1); last = now;
  pollInput(dt);
  if (!renderer.xr.isPresenting) controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
